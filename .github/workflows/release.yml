# A tag v* makes a release: goreleaser builds the CLI for macOS and Linux and
# attaches it with checksums.txt. This file is the same in suppyhq-cli and
# lognorth-cli; each repo's .goreleaser file names its binary and archives.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The same gate as CI, so a tag on a red commit releases nothing.
      - run: go vet ./...
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
