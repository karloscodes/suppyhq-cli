# The CI of a Go CLI. This file is the same in suppyhq-cli and lognorth-cli;
# chasen runs the same jobs plus its own end-to-end test. Its name must stay
# "CI": merge-security-updates.yml waits for a workflow of that name.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  security:
    uses: karloscodes/workflows/.github/workflows/go-security.yml@v1.1.0

  gitleaks:
    uses: karloscodes/workflows/.github/workflows/gitleaks.yml@v1.1.0

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [go-test, security, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
