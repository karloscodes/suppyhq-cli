# The CI of a Go CLI. This file is the same in suppyhq-cli and lognorth-cli;
# chasen runs the same jobs plus its own end-to-end test. Its name must stay
# "CI": merge-security-updates.yml waits for a workflow of that name.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # gosec v2.29.0 pins a golang.org/x/tools too old to read Go 1.27.2
      # packages, so it is built with x/tools v0.52.0.
      - name: Build gosec
        run: |
          cd "$(mktemp -d)"
          go mod init gosec-build
          go get github.com/securego/gosec/v2/cmd/gosec@v2.29.0 golang.org/x/tools@v0.52.0
          go build -o "$RUNNER_TEMP/gosec" github.com/securego/gosec/v2/cmd/gosec
      - run: $RUNNER_TEMP/gosec -severity high -confidence high ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  # The one check to require on main: it passes when every job above passed.
  test:
    name: test
    if: always()
    needs: [go-test, gosec, govulncheck, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - run: |
          ! grep -qE "failure|cancelled" <<<"${{ join(needs.*.result, ' ') }}"
